name: integracao continua

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop", "staging"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    runs-on: ubuntu-latest
    needs: estagio_lint
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties
        run: |
          cat > sonar-project.properties <<'EOF'
          sonar.projectKey=rafa-restaurante
          sonar.projectName=Rafa-Restaurante
          sonar.sources=.
          sonar.inclusions=**/*.js
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**
          EOF

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_S }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"

  job_release_docker:
    runs-on: ubuntu-latest
    needs: job_sonar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build da Imagem Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/rafa-restaurante:latest .

      - name: Push da Imagem para o Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/rafa-restaurante:latest

  job_trivy:
    runs-on: ubuntu-latest
    needs: job_release_docker
    steps:
      - name: Rodar Trivy na imagem Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/rafa-restaurante:latest
          format: table
          exit-code: 0

  job_deploy_aws:
    needs: job_trivy
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Preparar arquivo Compose com o identificador do aluno
        run: |
          cp docker-compose.yml docker-compose-rafael-duraes.yml

      - name: Copiar arquivo compose pra AWS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-rafael-duraes.yml,init.sql"
          target: "/home/${{ secrets.EC2_USER }}/rafael-duraes"

      - name: Executar comandos na AWS (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/rafael-duraes

            # Executa o init.sql no container MySQL antes de subir a aplicação
            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql

            echo "✅ init.sql executado com sucesso!"

            # Faz pull da nova imagem e sobe o container da aplicação
            sudo docker compose -f docker-compose-rafael-duraes.yml pull
            sudo docker compose -f docker-compose-rafael-duraes.yml up -d

            echo "✅ Deploy do aluno rafael-duraes finalizado com sucesso!"
